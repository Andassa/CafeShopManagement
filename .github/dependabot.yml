version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: docker
    ignore:
      # mysql-connector-java 5.1 requiert mysql_native_password, supprimé après MySQL 8.0
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
